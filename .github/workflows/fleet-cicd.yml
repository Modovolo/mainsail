name: Fleet CI/CD

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build/deploy (equivalent to script TAG arg)"
        required: false
        default: "latest"
        type: string
      registry_namespace:
        description: "Docker registry namespace (equivalent to REGISTRY in script)"
        required: false
        default: "jmarji"
        type: string
      fleet_manager_repo:
        description: "GitHub repo slug for fleet-manager source"
        required: false
        default: "Modovolo/fleet-manager"
        type: string
      moonraker_repo:
        description: "GitHub repo slug for moonraker source"
        required: false
        default: "Modovolo/moonraker"
        type: string
      monitor_repo:
        description: "GitHub repo slug for bfp-print-monitor source"
        required: false
        default: "Modovolo/bfp-print-monitor"
        type: string
      fleet_manager:
        description: "Build and push fleet-manager"
        required: false
        default: false
        type: boolean
      mainsail:
        description: "Build and push mainsail"
        required: false
        default: false
        type: boolean
      moonraker:
        description: "Build and push moonraker"
        required: false
        default: false
        type: boolean
      monitor:
        description: "Build and push bfp-print-monitor-web"
        required: false
        default: false
        type: boolean
      all:
        description: "Build and push all containers"
        required: false
        default: false
        type: boolean
      apply:
        description: "Apply k8s manifests"
        required: false
        default: false
        type: boolean
      restart:
        description: "Restart fleet deployments"
        required: false
        default: false
        type: boolean
      deploy:
        description: "Build all + apply manifests + restart deployments"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fleet-cicd
  cancel-in-progress: false

jobs:
  fleet-cicd:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}

    steps:
      - name: Checkout mainsail
        uses: actions/checkout@v4

      - name: Resolve flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FLEET_MANAGER="${{ inputs.fleet_manager }}"
          BUILD_MAINSAIL="${{ inputs.mainsail }}"
          BUILD_MOONRAKER="${{ inputs.moonraker }}"
          BUILD_MONITOR="${{ inputs.monitor }}"
          APPLY_MANIFESTS="${{ inputs.apply }}"
          RESTART_PODS="${{ inputs.restart }}"

          if [[ "${{ inputs.all }}" == "true" ]]; then
            BUILD_FLEET_MANAGER="true"
            BUILD_MAINSAIL="true"
            BUILD_MOONRAKER="true"
            BUILD_MONITOR="true"
          fi

          if [[ "${{ inputs.deploy }}" == "true" ]]; then
            BUILD_FLEET_MANAGER="true"
            BUILD_MAINSAIL="true"
            BUILD_MOONRAKER="true"
            BUILD_MONITOR="true"
            APPLY_MANIFESTS="true"
            RESTART_PODS="true"
          fi

          if [[ "$BUILD_FLEET_MANAGER" != "true" && "$BUILD_MAINSAIL" != "true" && "$BUILD_MOONRAKER" != "true" && "$BUILD_MONITOR" != "true" && "$APPLY_MANIFESTS" != "true" && "$RESTART_PODS" != "true" ]]; then
            echo "No operation selected. Enable at least one option or use deploy/all."
            exit 1
          fi

          echo "build_fleet_manager=$BUILD_FLEET_MANAGER" >> "$GITHUB_OUTPUT"
          echo "build_mainsail=$BUILD_MAINSAIL" >> "$GITHUB_OUTPUT"
          echo "build_moonraker=$BUILD_MOONRAKER" >> "$GITHUB_OUTPUT"
          echo "build_monitor=$BUILD_MONITOR" >> "$GITHUB_OUTPUT"
          echo "apply_manifests=$APPLY_MANIFESTS" >> "$GITHUB_OUTPUT"
          echo "restart_pods=$RESTART_PODS" >> "$GITHUB_OUTPUT"

      - name: Show plan
        shell: bash
        run: |
          echo "=== Fleet CI/CD ==="
          echo "Tag: $TAG"
          echo "Registry namespace: $REGISTRY_NAMESPACE"
          echo "build_fleet_manager=${{ steps.flags.outputs.build_fleet_manager }}"
          echo "build_mainsail=${{ steps.flags.outputs.build_mainsail }}"
          echo "build_moonraker=${{ steps.flags.outputs.build_moonraker }}"
          echo "build_monitor=${{ steps.flags.outputs.build_monitor }}"
          echo "apply_manifests=${{ steps.flags.outputs.apply_manifests }}"
          echo "restart_pods=${{ steps.flags.outputs.restart_pods }}"

      - name: Checkout moonraker repo
        if: steps.flags.outputs.build_moonraker == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.moonraker_repo }}
          path: moonraker-src
          token: ${{ secrets.FLEET_REPO_READ_TOKEN || github.token }}

      - name: Checkout fleet-manager repo
        if: steps.flags.outputs.build_fleet_manager == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.fleet_manager_repo }}
          path: fleet-manager-src
          token: ${{ secrets.FLEET_REPO_READ_TOKEN || github.token }}

      - name: Checkout bfp-print-monitor repo
        if: steps.flags.outputs.build_monitor == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.monitor_repo }}
          path: bfp-print-monitor-src
          token: ${{ secrets.FLEET_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        if: steps.flags.outputs.build_fleet_manager == 'true' || steps.flags.outputs.build_mainsail == 'true' || steps.flags.outputs.build_moonraker == 'true' || steps.flags.outputs.build_monitor == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.flags.outputs.build_fleet_manager == 'true' || steps.flags.outputs.build_mainsail == 'true' || steps.flags.outputs.build_moonraker == 'true' || steps.flags.outputs.build_monitor == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push fleet-manager
        if: steps.flags.outputs.build_fleet_manager == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./fleet-manager-src
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/fleet-manager:${{ env.TAG }}

      - name: Build and push mainsail
        if: steps.flags.outputs.build_mainsail == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/mainsail:${{ env.TAG }}

      - name: Build and push moonraker
        if: steps.flags.outputs.build_moonraker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./moonraker-src
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/moonraker:${{ env.TAG }}

      - name: Build and push bfp-print-monitor-web
        if: steps.flags.outputs.build_monitor == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./bfp-print-monitor-src
          file: ./bfp-print-monitor-src/docker/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY_NAMESPACE }}/bfp-print-monitor-web:${{ env.TAG }}

      - name: Set up kubectl
        if: steps.flags.outputs.apply_manifests == 'true' || steps.flags.outputs.restart_pods == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: steps.flags.outputs.apply_manifests == 'true' || steps.flags.outputs.restart_pods == 'true'
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.FLEET_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBECONFIG_B64}" ]]; then
            echo "Missing required secret: FLEET_KUBECONFIG_B64"
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update image tags in manifests
        if: steps.flags.outputs.apply_manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          K8S_DIR="./k8s"

          sed -i "s|image: ${REGISTRY_NAMESPACE}/fleet-manager:.*|image: ${REGISTRY_NAMESPACE}/fleet-manager:${TAG}|g" "$K8S_DIR/fleet-manager.yaml"
          sed -i "s|image: ${REGISTRY_NAMESPACE}/mainsail:.*|image: ${REGISTRY_NAMESPACE}/mainsail:${TAG}|g" "$K8S_DIR/deployments.yaml"
          sed -i "s|image: ${REGISTRY_NAMESPACE}/moonraker:.*|image: ${REGISTRY_NAMESPACE}/moonraker:${TAG}|g" "$K8S_DIR/deployments.yaml"
          sed -i "s|image: ${REGISTRY_NAMESPACE}/bfp-print-monitor-web:.*|image: ${REGISTRY_NAMESPACE}/bfp-print-monitor-web:${TAG}|g" "$K8S_DIR/deployments.yaml"

      - name: Apply k8s manifests
        if: steps.flags.outputs.apply_manifests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          K8S_DIR="./k8s"

          kubectl apply -f "$K8S_DIR/namespace.yaml"
          kubectl apply -f "$K8S_DIR/storage.yaml"
          kubectl apply -f "$K8S_DIR/secrets.yaml"
          kubectl apply -f "$K8S_DIR/configmaps.yaml"
          kubectl apply -f "$K8S_DIR/postgresql.yaml"
          kubectl apply -f "$K8S_DIR/fleet-manager.yaml"
          kubectl apply -f "$K8S_DIR/deployments.yaml"
          kubectl apply -f "$K8S_DIR/services.yaml"
          kubectl apply -f "$K8S_DIR/ingress.yaml"

      - name: Restart fleet deployments
        if: steps.flags.outputs.restart_pods == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.flags.outputs.build_fleet_manager }}" == "true" || "${{ steps.flags.outputs.apply_manifests }}" == "true" ]]; then
            kubectl rollout restart deployment/fleet-manager -n fleet
          fi

          if [[ "${{ steps.flags.outputs.build_mainsail }}" == "true" || "${{ steps.flags.outputs.apply_manifests }}" == "true" ]]; then
            kubectl rollout restart deployment/mainsail -n fleet
          fi

          if [[ "${{ steps.flags.outputs.build_moonraker }}" == "true" || "${{ steps.flags.outputs.apply_manifests }}" == "true" ]]; then
            kubectl rollout restart deployment/moonraker -n fleet
          fi

          if [[ "${{ steps.flags.outputs.build_monitor }}" == "true" || "${{ steps.flags.outputs.apply_manifests }}" == "true" ]]; then
            kubectl rollout restart deployment/bfp-print-monitor -n fleet
          fi

      - name: Wait for rollouts
        if: steps.flags.outputs.restart_pods == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/fleet-manager -n fleet --timeout=120s || true
          kubectl rollout status deployment/mainsail -n fleet --timeout=120s || true
          kubectl rollout status deployment/moonraker -n fleet --timeout=120s || true
          kubectl rollout status deployment/bfp-print-monitor -n fleet --timeout=120s || true

      - name: Show fleet pod status
        if: steps.flags.outputs.apply_manifests == 'true' || steps.flags.outputs.restart_pods == 'true'
        shell: bash
        run: kubectl get pods -n fleet
