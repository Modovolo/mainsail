# Moonraker backend configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: moonraker-config
  namespace: fleet
  labels:
    app.kubernetes.io/name: moonraker
    app.kubernetes.io/component: backend
data:
  moonraker.conf: |
    # Moonraker Configuration for Fleet Deployment
    [server]
    host: 0.0.0.0
    port: 7125
    max_upload_size: 1024
    klippy_uds_address: /printer_data/comms/klippy.sock

    [file_manager]
    enable_object_processing: True

    [authorization]
    cors_domains:
      *
    trusted_clients:
      # WireGuard network range
      10.10.0.0/24
      # Kubernetes pod network (Calico/Linode)
      10.2.0.0/16
      10.244.0.0/16
      10.96.0.0/12
      10.128.0.0/16
      # Linode node IPs
      45.79.0.0/16
      139.144.0.0/16
      # Localhost
      127.0.0.0/8
      ::1/128

    [octoprint_compat]

    [history]

    [announcements]
    subscriptions:
      mainsail

    [update_manager]
    enable_auto_refresh: True

    [update_manager mainsail]
    type: web
    channel: stable
    repo: mainsail-crew/mainsail
    path: /printer_data/mainsail

    # Fleet Management WebSocket Support
    [fleet_manager]
    enabled: True
    fleet_endpoint: ws://fleet-manager.fleet.svc.cluster.local:9080/ws
    update_interval: 30
---
# Nginx reverse proxy configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: fleet
  labels:
    app.kubernetes.io/name: nginx-proxy
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript 
                   application/rss+xml application/atom+xml image/svg+xml;

        # WebSocket upgrade map
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        # Rate limiting zone
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

        # Upstream definitions
        upstream mainsail {
            server mainsail:8080;
            keepalive 32;
        }

        upstream moonraker {
            server moonraker:7125;
            keepalive 32;
        }

        server {
            listen 80;
            listen [::]:80;
            server_name _;

            client_max_body_size 1024M;

            # Health check endpoint
            location /healthz {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Mainsail frontend (SPA)
            location / {
                proxy_pass http://mainsail;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # SPA fallback handled by mainsail container
            }

            # Moonraker API
            location /api/ {
                limit_req zone=api_limit burst=50 nodelay;
                
                proxy_pass http://moonraker/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Strip fleet JWT tokens - Moonraker uses trusted IP auth
                proxy_set_header Authorization "";
            }

            # Moonraker WebSocket
            location /websocket {
                proxy_pass http://moonraker/websocket;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # WebSocket support
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                
                # WebSocket timeouts
                proxy_connect_timeout 7d;
                proxy_send_timeout 7d;
                proxy_read_timeout 7d;
            }

            # Server info endpoint (direct to moonraker)
            location /server/ {
                proxy_pass http://moonraker/server/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Strip fleet JWT tokens - Moonraker uses trusted IP auth
                proxy_set_header Authorization "";
            }

            # Printer endpoints
            location /printer/ {
                proxy_pass http://moonraker/printer/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Strip fleet JWT tokens - Moonraker uses trusted IP auth
                proxy_set_header Authorization "";
            }

            # Machine endpoints
            location /machine/ {
                proxy_pass http://moonraker/machine/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Strip fleet JWT tokens - Moonraker uses trusted IP auth
                proxy_set_header Authorization "";
            }

            # Access endpoints
            location /access/ {
                proxy_pass http://moonraker/access/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Strip fleet JWT tokens - Moonraker uses trusted IP auth
                proxy_set_header Authorization "";
            }
        }
    }

