---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainsail
  namespace: fleet
  labels:
    app: mainsail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mainsail
  template:
    metadata:
      labels:
        app: mainsail
    spec:
      imagePullSecrets:
        - name: dockerhub-creds
      containers:
        - name: mainsail
          image: jmarji/mainsail:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mainsail
  namespace: fleet
  labels:
    app: mainsail
spec:
  selector:
    app: mainsail
  ports:
    - name: http
      port: 8080
      targetPort: 80
      protocol: TCP
  type: ClusterIP
