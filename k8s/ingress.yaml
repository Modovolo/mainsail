---
# Ingress for external HTTPS access
# Requires: ingress-nginx controller and cert-manager
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-ingress
  namespace: fleet
  labels:
    app.kubernetes.io/name: printer-fleet
    app.kubernetes.io/component: ingress
  annotations:
    # For cert-manager TLS
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Nginx ingress annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "86400"
    # WebSocket support - Force HTTP/1.1 for WebSocket upgrades
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    # Allow HTTP for ACME challenges
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fleet.modovolo.com
      secretName: fleet-tls
  rules:
    - host: fleet.modovolo.com
      http:
        paths:
          # Auth API endpoints
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Fleet API endpoints
          - path: /api/fleet
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Printers API endpoints (user's printers)
          - path: /api/printers
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Printer registration API endpoints
          - path: /api/printer-registration
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Webcam proxy endpoints (for WebRTC streaming in fleet mode)
          - path: /webcam/proxy
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Health check API
          - path: /api/health
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # WebSocket endpoints for fleet management
          - path: /ws/printer
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 9080
          - path: /ws/web
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 9081
          # WebSocket proxy for individual printer connections (Moonraker proxy)
          - path: /ws/client
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 9081
          # Device pairing API endpoints
          - path: /api/pairing
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Printer profile API endpoints
          - path: /api/printer-profiles
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Central file repository API endpoints
          - path: /api/files
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Groups API endpoints
          - path: /api/groups
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Print Queue API endpoints
          - path: /api/print-queue
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Config Sync API endpoints
          - path: /api/config-sync
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Monitoring API endpoints
          - path: /api/monitoring
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Client download endpoints
          - path: /api/client
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # G-code recipes API endpoints
          - path: /api/gcode-recipes
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Design tree API endpoints
          - path: /api/design-tree
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # PMI / downtime / inspections API endpoints
          - path: /api/pmi
            pathType: Prefix
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # Install script
          - path: /install.sh
            pathType: ImplementationSpecific
            backend:
              service:
                name: fleet-manager
                port:
                  number: 8080
          # All other traffic goes through nginx-proxy which handles routing
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-proxy
                port:
                  number: 80
---
