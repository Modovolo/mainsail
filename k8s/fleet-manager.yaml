---
# Fleet Manager Deployment
# Note: Secrets are defined in secrets.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-manager
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: websocket
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fleet-manager
  template:
    metadata:
      labels:
        app: fleet-manager
        app.kubernetes.io/name: fleet-manager
        app.kubernetes.io/component: websocket
    spec:
      imagePullSecrets:
        - name: dockerhub-creds
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 1000:1000 /data/files']
          volumeMounts:
            - name: fleet-files
              mountPath: /data/files
      containers:
        - name: fleet-manager
          image: jmarji/fleet-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http-api
              protocol: TCP
            - containerPort: 9080
              name: printer-ws
              protocol: TCP
            - containerPort: 9081
              name: web-ws
              protocol: TCP
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-secrets
                  key: jwt-secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-secrets
                  key: admin-password
            - name: DB_HOST
              value: "postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "fleet_manager"
            - name: DB_USER
              value: "fleet_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: POSTGRES_PASSWORD
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-secrets
                  key: resend-api-key
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: fleet-manager-secrets
                  key: email-from
            - name: FLEET_URL
              value: "https://fleet.modovolo.com"
            - name: BFP_MONITOR_BASE_URL
              value: "http://bfp-print-monitor:5000"
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: fleet-files
              mountPath: /data/files
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: fleet-files
          persistentVolumeClaim:
            claimName: fleet-files-data

---
# Fleet Manager Service
apiVersion: v1
kind: Service
metadata:
  name: fleet-manager
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-manager
    app.kubernetes.io/component: websocket
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-api
    - port: 9080
      targetPort: 9080
      protocol: TCP
      name: printer-ws
    - port: 9081
      targetPort: 9081
      protocol: TCP
      name: web-ws
  selector:
    app: fleet-manager